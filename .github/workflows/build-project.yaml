name: Build Project
on:
  workflow_call:
    outputs:
      pluginName:
        description: Project name detected by parsing build spec file
        value: ${{ jobs.check-event.outputs.pluginName }}
jobs:
  check-event:
    name: Check GitHub Event Data 🔎
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    outputs:
      package: ${{ steps.setup.outputs.package }}
      codesign: ${{ steps.setup.outputs.codesign }}
      notarize: ${{ steps.setup.outputs.notarize }}
      config: ${{ steps.setup.outputs.config }}
      commitHash: ${{ steps.setup.outputs.commitHash }}
      pluginName: ${{ steps.setup.outputs.pluginName }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Event Data ☑️
        id: setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Check Event Data ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          case "${GITHUB_EVENT_NAME}" in
            pull_request)
              config_data=('codesign:false' 'notarize:false' 'package:false' 'config:RelWithDebInfo')
              if gh pr view ${{ github.event.number }} --json labels \
                | jq -e -r '.labels[] | select(.name == "Seeking Testers")' > /dev/null; then
                config_data[0]='codesign:true'
                config_data[2]='package:true'
              fi
              ;;
            push)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              if [[ ${GITHUB_REF_NAME} =~ [0-9]+.[0-9]+.[0-9]+(-(rc|beta).+)? ]]; then
                config_data[1]='notarize:true'
                config_data[3]='config:Release'
              fi
              ;;
            workflow_dispatch)
              # package:true so a manual run actually exercises the INSTALLER path. With it
              # false, the only thing that ever built a .pkg/.exe/.deb was pushing a real
              # version tag — i.e. the packaging path could only be tested in production.
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            schedule)
              config_data=('codesign:true' 'notarize:false' 'package:true' 'config:RelWithDebInfo')
              ;;
            *) ;;
          esac

          for config in "${config_data[@]}"; do
            IFS=':' read -r key value <<< "${config}"
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done
          echo "commitHash=${GITHUB_SHA:0:9}" >> $GITHUB_OUTPUT

          plugin_name="$(grep 'name' buildspec.json | sed -E -e 's/^.+"name":[^"]+"(.+)",?$/\1/g')"
          plugin_display_name="$(grep 'displayName' buildspec.json | sed -E -e 's/^.+"displayName":[^"]+"(.+)",?$/\1/g' || echo "")"

          # A release tag must match the version in buildspec.json, otherwise the
          # release would ship installer files named after a different version.
          if [[ "${GITHUB_EVENT_NAME}" == 'push' && "${GITHUB_REF_TYPE}" == 'tag' ]]; then
            spec_version="$(jq -r '.version' buildspec.json)"
            case "${GITHUB_REF_NAME}" in
              "${spec_version}"|"${spec_version}"-beta*|"${spec_version}"-rc*) ;;
              *)
                echo "::error::Tag '${GITHUB_REF_NAME}' does not match version '${spec_version}' in buildspec.json. Bump \"version\" in buildspec.json, commit, and re-tag."
                exit 1
                ;;
            esac
          fi

          if [[ "${plugin_display_name}" ]]; then
            echo "pluginName=${plugin_display_name}" >> $GITHUB_OUTPUT
          else
            echo "pluginName=${plugin_name}" >> $GITHUB_OUTPUT
          fi

  macos-build:
    name: Build for macOS 🍏
    runs-on: macos-15
    needs: check-event
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if (( ${+RUNNER_DEBUG} )) setopt XTRACE

          print '::group::Enable Xcode 16.1'
          sudo xcode-select --switch "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)/Contents/Developer" || sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          print '::endgroup::'

          print '::group::Clean Homebrew Environment'
          local -a unwanted_formulas=()
          local -a remove_formulas=()
          for formula (${unwanted_formulas}) {
            if [[ -d ${HOMEBREW_PREFIX}/Cellar/${formula} ]] remove_formulas+=(${formula})
          }

          if (( #remove_formulas )) brew uninstall --ignore-dependencies ${remove_formulas}
          print '::endgroup::'

          local product_name
          local product_version
          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          print "pluginName=${product_name}" >> $GITHUB_OUTPUT
          print "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-ccache-

      - name: Set Up Codesigning 🔑
        uses: ./.github/actions/setup-macos-codesigning
        if: fromJSON(needs.check-event.outputs.codesign)
        id: codesign
        with:
          codesignIdentity: ${{ secrets.MACOS_SIGNING_APPLICATION_IDENTITY }}
          installerIdentity: ${{ secrets.MACOS_SIGNING_INSTALLER_IDENTITY }}
          codesignCertificate: ${{ secrets.MACOS_SIGNING_CERT }}
          certificatePassword: ${{ secrets.MACOS_SIGNING_CERT_PASSWORD }}
          keychainPassword: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          provisioningProfile: ${{ secrets.MACOS_SIGNING_PROVISIONING_PROFILE }}
          notarizationUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          notarizationPassword: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: macos-universal
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}
          codesign: ${{ fromJSON(needs.check-event.outputs.codesign) && fromJSON(steps.codesign.outputs.haveCodesignIdent) }}
          codesignIdent: ${{ steps.codesign.outputs.codesignIdent }}
          installerIdent: ${{ steps.codesign.outputs.installerIdent }}
          codesignTeam: ${{ steps.codesign.outputs.codesignTeam }}
          notarize: ${{ fromJSON(needs.check-event.outputs.notarize) && fromJSON(steps.codesign.outputs.haveNotarizationUser) }}
          codesignUser: ${{ secrets.MACOS_NOTARIZATION_USERNAME }}
          codesignPass: ${{ secrets.MACOS_NOTARIZATION_PASSWORD }}

      - name: Verify Signature + Notarization 🔒
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        env:
          WANT_CODESIGN: ${{ needs.check-event.outputs.codesign }}
          HAVE_CODESIGN: ${{ steps.codesign.outputs.haveCodesignIdent }}
          WANT_NOTARIZE: ${{ needs.check-event.outputs.notarize }}
          HAVE_NOTARY: ${{ steps.codesign.outputs.haveNotarizationUser }}
        run: |
          : Verify Signature + Notarization 🔒
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          set -euo pipefail

          # WHY THIS EXISTS: the signing gate requires all three of identity, installer
          # identity and cert. Remove or rename ANY one — cert rotation, a typo, a fork — and
          # the packaging script falls through to a plain `mv`, uploading an UNSIGNED .pkg
          # under the identical filename with a green checkmark. On Apple Silicon that plugin
          # will not load and the .pkg reports itself as damaged. Nothing verified it.
          if [[ "${WANT_CODESIGN}" == 'true' && "${HAVE_CODESIGN}" != 'true' ]]; then
            echo "::error::This build was supposed to be signed but no signing identity was" \
                 "available, so an UNSIGNED package was produced. Check the MACOS_SIGNING_*" \
                 "secrets — all of IDENTITY, INSTALLER_IDENTITY and CERT must be present."
            exit 1
          fi
          if [[ "${WANT_NOTARIZE}" == 'true' && "${HAVE_NOTARY}" != 'true' ]]; then
            echo "::error::This build was supposed to be notarized but the notarization" \
                 "credentials were missing, so an un-notarized package was produced under the" \
                 "same filename. Check MACOS_NOTARIZATION_USERNAME / _PASSWORD."
            exit 1
          fi

          pkg=(${{ github.workspace }}/release/*.pkg)
          if (( ${#pkg[@]} == 0 )) || [[ ! -f "${pkg[1]:-${pkg[0]}}" ]]; then
            echo "::notice::No .pkg produced (not a packaging build) — nothing to verify."
            exit 0
          fi
          target="${pkg[1]:-${pkg[0]}}"
          echo "Verifying ${target##*/}"

          if [[ "${HAVE_CODESIGN}" == 'true' ]]; then
            # Does the system consider this installer trustworthy for install?
            spctl -a -vvv -t install "${target}"
          fi
          if [[ "${WANT_NOTARIZE}" == 'true' ]]; then
            # Is the notarization ticket actually STAPLED? Notarization that "succeeded" but
            # failed to staple leaves a package that needs the network to validate.
            xcrun stapler validate -v "${target}"
          fi

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal.*

      - name: Upload Debug Symbol Artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ needs.check-event.outputs.config == 'Release' }}
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-${{ needs.check-event.outputs.commitHash }}-dSYMs
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-macos-universal-dSYMs.*

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-ccache-${{ needs.check-event.outputs.config }}

  ubuntu-build:
    name: Build for Ubuntu 🐧
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    needs: check-event
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          : Set Up Environment 🔧
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi

          read -r product_name product_version <<< \
            "$(jq -r '. | {name, version} | join(" ")' buildspec.json)"

          echo "pluginName=${product_name}" >> $GITHUB_OUTPUT
          echo "pluginVersion=${product_version}" >> $GITHUB_OUTPUT

      - uses: actions/cache/restore@v4
        id: ccache-cache
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x86_64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Upload Source Tarball 🗜️
        uses: actions/upload-artifact@v4
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-sources-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-source.*

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*.*

      - name: Upload debug symbol artifacts 🪲
        uses: actions/upload-artifact@v4
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-${{ matrix.os }}-x86_64-${{ needs.check-event.outputs.commitHash }}-dbgsym
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-x86_64*-dbgsym.ddeb

      - uses: actions/cache/save@v4
        if: github.event_name != 'pull_request' && steps.ccache-cache.outputs.cache-hit != 'true'
        with:
          path: ${{ github.workspace }}/.ccache
          key: ${{ runner.os }}-${{ matrix.os }}-ccache-x86_64-${{ needs.check-event.outputs.config }}

  windows-build:
    name: Build for Windows 🪟
    runs-on: windows-2022
    needs: check-event
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set Up Environment 🔧
        id: setup
        run: |
          # Set Up Environment 🔧
          if ( $Env:RUNNER_DEBUG -ne $null ) {
            Set-PSDebug -Trace 1
          }

          $BuildSpec = Get-Content -Path buildspec.json -Raw | ConvertFrom-Json
          $ProductName = $BuildSpec.name
          $ProductVersion = $BuildSpec.version

          "pluginName=${ProductName}" >> $env:GITHUB_OUTPUT
          "pluginVersion=${ProductVersion}" >> $env:GITHUB_OUTPUT

      - name: Build Plugin 🧱
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}

      - name: Package Plugin 📀
        uses: ./.github/actions/package-plugin
        with:
          target: x64
          config: ${{ needs.check-event.outputs.config }}
          package: ${{ fromJSON(needs.check-event.outputs.package) }}

      - name: Sign Windows Binaries 🔑
        if: ${{ fromJSON(needs.check-event.outputs.package) }}
        env:
          WIN_CERT: ${{ secrets.WINDOWS_SIGNING_CERT }}
          WIN_CERT_PASS: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        run: |
          # Sign Windows Binaries 🔑
          if ( $Env:RUNNER_DEBUG -ne $null ) { Set-PSDebug -Trace 1 }

          # Unsigned Windows binaries are the single biggest trust problem in this pipeline:
          # SmartScreen shows a full-screen block, the browser calls the download uncommon, and
          # UAC says "Publisher: Unknown". So say so LOUDLY rather than shipping quietly.
          if ( [string]::IsNullOrEmpty($Env:WIN_CERT) ) {
            Write-Output "::warning title=Windows build is UNSIGNED::No WINDOWS_SIGNING_CERT secret. Users will see SmartScreen and 'Publisher: Unknown'. Add WINDOWS_SIGNING_CERT (base64 .pfx) + WINDOWS_SIGNING_CERT_PASSWORD, or switch to Azure Trusted Signing."
            exit 0
          }

          $pfx = Join-Path $Env:RUNNER_TEMP 'spancam-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($Env:WIN_CERT))

          $signtool = Get-ChildItem -Path 'C:\Program Files (x86)\Windows Kits\10\bin' `
            -Recurse -Filter 'signtool.exe' -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1 -ExpandProperty FullName
          if ( -not $signtool ) { throw 'signtool.exe not found on the runner' }

          # Sign the DLL *and* the installer. The DLL matters on its own because the .zip is a
          # distribution path too, and an installer that drops an unsigned DLL still trips
          # SmartScreen later. RFC-3161 timestamp so signatures outlive the certificate.
          $targets = @()
          $targets += Get-ChildItem -Path 'release' -Recurse -Include '*.dll' -ErrorAction SilentlyContinue
          $targets += Get-ChildItem -Path 'release' -Recurse -Include '*.exe' -ErrorAction SilentlyContinue
          foreach ( $t in $targets ) {
            & $signtool sign /f $pfx /p $Env:WIN_CERT_PASS `
              /fd sha256 /tr 'http://timestamp.digicert.com' /td sha256 /v $t.FullName
            if ( $LASTEXITCODE -ne 0 ) { throw "signtool failed for $($t.FullName)" }
          }
          Remove-Item $pfx -Force

          foreach ( $t in $targets ) {
            & $signtool verify /pa /v $t.FullName
            if ( $LASTEXITCODE -ne 0 ) { throw "signature verification failed for $($t.FullName)" }
          }

      - name: Upload Artifacts 📡
        uses: actions/upload-artifact@v4
        with:
          # An empty artifact must FAIL the job. Left at the default
          # `warn`, a packaging step that produced nothing still went
          # green and the release simply came out missing a platform.
          if-no-files-found: error
          name: ${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64-${{ needs.check-event.outputs.commitHash }}
          path: ${{ github.workspace }}/release/${{ steps.setup.outputs.pluginName }}-${{ steps.setup.outputs.pluginVersion }}-windows-x64*.*
