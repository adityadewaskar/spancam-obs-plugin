name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
concurrency:
  # Two pushes to the same ref used to be able to race into `create-release` (a main push and
  # a tag push ran six seconds apart on 2026-08-19). Queue instead of cancelling: cancelling
  # mid-upload would leave a release holding half its assets.
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)?(.)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Reject Unrecognised Tag 🚫
        if: ${{ !fromJSON(steps.check.outputs.validTag) }}
        run: |
          : Reject Unrecognised Tag 🚫
          echo "::error::Tag '${GITHUB_REF_NAME}' is not a release version." \
               "Every later step is gated on validTag, so this run would otherwise report SUCCESS" \
               "while creating no release at all — the failure mode that hides a broken release."
          exit 1

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Clear Stale Release Assets 🧹
        if: fromJSON(steps.check.outputs.validTag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Clear Stale Release Assets 🧹
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          # action-gh-release replaces only the assets it has local files for, so anything a
          # PREVIOUS run of this tag uploaded survives. The 0.1.0 draft ended up holding three
          # assets from one commit and four orphans from another, with checksums from a third —
          # publishable, and wrong. Delete the whole existing release for this tag so the upload
          # below is the only thing on it. A DRAFT carries no public URL, so nothing breaks; a
          # published release is left alone rather than yanked from under anyone.
          tag='${{ steps.check.outputs.version }}'
          if gh release view "${tag}" --json isDraft -q .isDraft 2>/dev/null | grep -qx true; then
            echo "Deleting the existing DRAFT for ${tag} so its assets cannot outlive this build."
            gh release delete "${tag}" --yes --cleanup-tag=false
          else
            echo "No draft release for ${tag} (or it is already published) — leaving it alone."
          fi

      - name: Compose Release Notes 📝
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Compose Release Notes 📝
          notes="${{ github.workspace }}/RELEASE_NOTES.md"
          {
            echo "## Install"
            echo
            echo "**Windows** — run the \`.exe\`, then restart OBS."
            echo "**macOS** — run the \`.pkg\` (signed and notarized), then restart OBS."
            echo "**Linux** — \`sudo apt install ./*.deb\`, then restart OBS."
            echo
            echo "Then in OBS: **Sources → + → Spancam Camera**, and pick your phone from the"
            echo "**Phone** dropdown. The phone needs the Spancam app open with Discoverable on,"
            echo "on the same network — or plugged in by USB."
            echo
            cat "${{ github.workspace }}/CHECKSUMS.txt"
          } > "${notes}"

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        # v3.0.2 (commit verified against the tag object via the API, not copied on trust).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
          # A pattern that matches nothing must fail rather than quietly shipping a release
          # that is missing a platform.
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz
