name: Push
run-name: ${{ github.ref_name }} push run 🚀
on:
  push:
    branches:
      - master
      - main
      - 'release/**'
    tags:
      - '*'
permissions:
  contents: write
concurrency:
  # Two pushes to the same ref used to be able to race into `create-release` (a main push and
  # a tag push ran six seconds apart on 2026-08-19). Queue instead of cancelling: cancelling
  # mid-upload would leave a release holding half its assets.
  group: '${{ github.workflow }} @ ${{ github.ref }}'
  cancel-in-progress: false
jobs:
  check-format:
    name: Check Formatting 🔍
    if: github.ref_name == 'master' || github.ref_name == 'main'
    uses: ./.github/workflows/check-format.yaml
    permissions:
      contents: read

  build-project:
    name: Build Project 🧱
    uses: ./.github/workflows/build-project.yaml
    secrets: inherit
    permissions:
      contents: read

  create-release:
    name: Create Release 🛫
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    needs: build-project
    defaults:
      run:
        shell: bash
    steps:
      - name: Check Release Tag ☑️
        id: check
        run: |
          : Check Release Tag ☑️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          case "${GITHUB_REF_NAME}" in
            +([0-9]).+([0-9]).+([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=false' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            +([0-9]).+([0-9]).+([0-9])-@(beta|rc)?(.)*([0-9]) )
              echo 'validTag=true' >> $GITHUB_OUTPUT
              echo 'prerelease=true' >> $GITHUB_OUTPUT
              echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
              ;;
            *) echo 'validTag=false' >> $GITHUB_OUTPUT ;;
          esac

      - name: Reject Unrecognised Tag 🚫
        if: ${{ !fromJSON(steps.check.outputs.validTag) }}
        run: |
          : Reject Unrecognised Tag 🚫
          echo "::error::Tag '${GITHUB_REF_NAME}' is not a release version." \
               "Every later step is gated on validTag, so this run would otherwise report SUCCESS" \
               "while creating no release at all — the failure mode that hides a broken release."
          exit 1

      - name: Download Build Artifacts 📥
        uses: actions/download-artifact@v4
        if: fromJSON(steps.check.outputs.validTag)
        id: download

      - name: Rename Files 🏷️
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Rename Files 🏷️
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          root_dir="$(pwd)"
          commit_hash="${GITHUB_SHA:0:9}"

          variants=(
            'windows-x64;zip|exe'
            'macos-universal;tar.xz|pkg'
            'ubuntu-24.04-x86_64;tar.xz|deb|ddeb'
            'sources;tar.xz'
          )

          for variant_data in "${variants[@]}"; do
            IFS=';' read -r variant suffix <<< "${variant_data}"

            candidates=(*-${variant}-${commit_hash}/@(*|*-dbgsym).@(${suffix}))

            for candidate in "${candidates[@]}"; do
              mv "${candidate}" "${root_dir}"
            done
          done

      - name: Generate Checksums 🪪
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Generate Checksums 🪪
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob

          echo "### Checksums" > ${{ github.workspace }}/CHECKSUMS.txt
          for file in ${{ github.workspace }}/@(*.exe|*.deb|*.ddeb|*.pkg|*.tar.xz|*.zip); do
            echo "    ${file##*/}: $(sha256sum "${file}" | cut -d " " -f 1)" >> ${{ github.workspace }}/CHECKSUMS.txt
          done

      - name: Clear Stale Release Assets 🧹
        if: fromJSON(steps.check.outputs.validTag)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          : Clear Stale Release Assets 🧹
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          # action-gh-release replaces only the assets it has local files for, so anything a
          # PREVIOUS run of this tag uploaded survives. The 0.1.0 draft ended up holding three
          # assets from one commit and four orphans from another, with checksums from a third —
          # publishable, and wrong. Delete the whole existing release for this tag so the upload
          # below is the only thing on it. A DRAFT carries no public URL, so nothing breaks; a
          # published release is left alone rather than yanked from under anyone.
          tag='${{ steps.check.outputs.version }}'
          if ! state=$(gh release view "${tag}" --json isDraft -q .isDraft 2>/dev/null); then
            echo "No existing release for ${tag} — nothing to clear."
          elif [[ "${state}" == 'true' ]]; then
            echo "Deleting the existing DRAFT for ${tag} so its assets cannot outlive this build."
            gh release delete "${tag}" --yes --cleanup-tag=false
          else
            # Strip the assets but KEEP the release: deleting a published release would 404 a
            # URL that is already on the website and in users' hands. Emptying it instead
            # leaves the upload below as the only thing on the release.
            echo "${tag} is already published — clearing its assets rather than yanking the release."
            gh release view "${tag}" --json assets -q '.assets[].name' | while read -r asset; do
              [[ -n "${asset}" ]] || continue
              echo "  deleting ${asset}"
              gh release delete-asset "${tag}" "${asset}" --yes
            done
          fi

      - name: Compose Release Notes 📝
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Compose Release Notes 📝
          notes="${{ github.workspace }}/RELEASE_NOTES.md"
          {
            echo "## Install"
            echo
            echo "**Windows** — run the \`.exe\`, then restart OBS."
            echo "**macOS** — run the \`.pkg\` (signed and notarized), then restart OBS."
            echo "**Linux** — \`sudo apt install ./*.deb\`, then restart OBS."
            echo
            echo "Then in OBS: **Sources → + → Spancam Camera**, and pick your phone from the"
            echo "**Phone** dropdown. The phone needs the Spancam app open with Discoverable on,"
            echo "on the same network — or plugged in by USB."
            echo
            cat "${{ github.workspace }}/CHECKSUMS.txt"
          } > "${notes}"

      - name: Create Release 🛫
        if: fromJSON(steps.check.outputs.validTag)
        id: create_release
        # v3.0.2 (commit verified against the tag object via the API, not copied on trust).
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          # Published outright: a tag push is the release. The draft step existed so a human
          # could eyeball the assets, but that made every release a two-part job where the
          # download links stayed 404 until someone remembered to click publish.
          draft: false
          prerelease: ${{ fromJSON(steps.check.outputs.prerelease) }}
          tag_name: ${{ steps.check.outputs.version }}
          name: ${{ needs.build-project.outputs.pluginName }} ${{ steps.check.outputs.version }}
          body_path: ${{ github.workspace }}/RELEASE_NOTES.md
          # A pattern that matches nothing must fail rather than quietly shipping a release
          # that is missing a platform.
          fail_on_unmatched_files: true
          files: |
            ${{ github.workspace }}/*.exe
            ${{ github.workspace }}/*.zip
            ${{ github.workspace }}/*.pkg
            ${{ github.workspace }}/*.deb
            ${{ github.workspace }}/*.ddeb
            ${{ github.workspace }}/*.tar.xz

      - name: Print Download Links 🔗
        if: fromJSON(steps.check.outputs.validTag)
        run: |
          : Print Download Links 🔗
          if [[ "${RUNNER_DEBUG}" ]]; then set -x; fi
          shopt -s extglob
          shopt -s nullglob

          # The website (adewaskar.com/apps/spancam/obs) reads its download URLs from
          # public/apps/spancam/config.json, which is updated BY HAND after a release is
          # published. Hand-updating means hand-typing five versioned URLs, and a typo there
          # is a dead download button that nothing in CI would ever catch. So print the block
          # ready to paste, derived from the files that were ACTUALLY uploaded a step ago
          # rather than from a guessed naming scheme.
          version='${{ steps.check.outputs.version }}'
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${version}"

          win_exe='' win_zip='' mac_pkg='' linux_deb='' linux_tar=''
          for file in "${GITHUB_WORKSPACE}"/@(*.exe|*.zip|*.pkg|*.deb|*.ddeb|*.tar.xz); do
            name="${file##*/}"
            case "${name}" in
              *-dbgsym.@(deb|ddeb) )      continue ;;
              *-source.tar.xz )           continue ;;
              *-windows-x64-Installer.exe ) win_exe="${base}/${name}" ;;
              *-windows-x64.zip )         win_zip="${base}/${name}" ;;
              *-macos-universal.pkg )     mac_pkg="${base}/${name}" ;;
              *-macos-universal.tar.xz )  continue ;;
              *.deb )                     linux_deb="${base}/${name}" ;;
              *-ubuntu-gnu.tar.xz|*-linux-gnu.tar.xz ) linux_tar="${base}/${name}" ;;
              * ) echo "::warning title=Unclassified release asset::${name} was uploaded but is not in the paste block." ;;
            esac
          done

          # A missing installer must be loud. Silently printing a block with three of five
          # URLs is how a platform ends up shipping a button that 404s.
          missing=()
          [[ "${win_exe}" ]]   || missing+=('windows .exe')
          [[ "${mac_pkg}" ]]   || missing+=('macOS .pkg')
          [[ "${linux_deb}" ]] || missing+=('linux .deb')
          if (( ${#missing[@]} )); then
            echo "::error title=Release is missing an installer::${missing[*]} — not printing a partial paste block."
            exit 1
          fi

          {
            echo "## 📥 Download links for \`config.json\`"
            echo
            echo "The release is already published, so every URL below is live right now."
            echo
            echo '| Platform | File | URL |'
            echo '| --- | --- | --- |'
            echo "| Windows | installer | ${win_exe} |"
            [[ "${win_zip}" ]] && echo "| Windows | zip (no SmartScreen prompt) | ${win_zip} |"
            echo "| macOS | pkg (signed + notarized) | ${mac_pkg} |"
            echo "| Linux | deb | ${linux_deb} |"
            [[ "${linux_tar}" ]] && echo "| Linux | tarball | ${linux_tar} |"
            echo
            echo "### Paste into \`public/apps/spancam/config.json\`"
            echo
            echo 'Replace the whole `"obs"` block. `store` and `demo` are yours to maintain.'
            echo
            echo '```json'
            echo '  "obs": {'
            echo "    \"min\": \"${version}\","
            echo "    \"latest\": \"${version}\","
            echo '    "howToUse": "https://adewaskar.com/apps/spancam/obs",'
            echo "    \"release\": \"https://github.com/${GITHUB_REPOSITORY}/releases/tag/${version}\","
            echo '    "downloads": {'
            echo '      "windows": {'
            echo "        \"installer\": \"${win_exe}\"$( [[ "${win_zip}" ]] && echo ',' )"
            [[ "${win_zip}" ]] && echo "        \"zip\": \"${win_zip}\""
            echo '      },'
            echo '      "macos": {'
            echo "        \"pkg\": \"${mac_pkg}\""
            echo '      },'
            echo '      "linux": {'
            echo "        \"deb\": \"${linux_deb}\"$( [[ "${linux_tar}" ]] && echo ',' )"
            [[ "${linux_tar}" ]] && echo "        \"tarball\": \"${linux_tar}\""
            echo '      }'
            echo '    }'
            echo '  }'
            echo '```'
          } | tee -a "${GITHUB_STEP_SUMMARY}"
